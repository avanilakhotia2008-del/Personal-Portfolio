<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain Rot Cookbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Caveat:wght@500;700&family=Karla:wght@400;500;700&display=swap">
<style>
/* Layout: gingham tablecloth header, a scroll-snap strip of recipe cards, then the real recipe with a sticky-note brain rot version underneath. */
:root {
  --bg: #F4F8FB;
  --ink: #1C2733;
  --muted: #566676;
  --card: #FFFFFF;
  --line: #D5E0E9;
  --gingham: rgba(66, 120, 170, 0.22);
  --tomato: #C93C2E;
  --tomato-ink: #FFFFFF;
  --butter: #F5D75A;
  --note-bg: #FBE27A;
  --note-ink: #2A2410;
  --bread: #E8BF82;
  --crust: #B9803F;
  --egg: #F7D44C;
  --pan: #3A4652;
  --focus: #1E6BB8;
  --f-display: 'Bagel Fat One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --f-body: 'Karla', 'Segoe UI', system-ui, sans-serif;
  --f-hand: 'Caveat', 'Segoe Print', 'Bradley Hand', cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11181F; --ink: #E9EFF4; --muted: #9AAABA; --card: #1A242E; --line: #2B3947;
    --gingham: rgba(111, 163, 207, 0.18); --tomato: #F0705F; --tomato-ink: #1A0B09;
    --butter: #E9CA4F; --note-bg: #F0D35E; --note-ink: #2A2410;
    --bread: #D9A867; --crust: #A66C2B; --egg: #F2CE45; --pan: #55636F; --focus: #7DB8EE;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11181F; --ink: #E9EFF4; --muted: #9AAABA; --card: #1A242E; --line: #2B3947;
  --gingham: rgba(111, 163, 207, 0.18); --tomato: #F0705F; --tomato-ink: #1A0B09;
  --butter: #E9CA4F; --note-bg: #F0D35E; --note-ink: #2A2410;
  --bread: #D9A867; --crust: #A66C2B; --egg: #F2CE45; --pan: #55636F; --focus: #7DB8EE;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 1rem;
  line-height: 1.55;
}
.wrap {
  max-width: 62rem;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, p, ul, ol { margin: 0; }
h1, h2, h3 { text-wrap: balance; font-weight: 400; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

/* Header: gingham tablecloth with a label card on it */
.top {
  background-color: var(--bg);
  background-image:
    repeating-linear-gradient(0deg, var(--gingham) 0 14px, transparent 14px 28px),
    repeating-linear-gradient(90deg, var(--gingham) 0 14px, transparent 14px 28px);
  border-bottom: 1px solid var(--line);
}
.top .wrap { padding-block: 40px; }
.label {
  display: inline-flex;
  flex-direction: column;
  gap: 8px;
  max-width: 100%;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 22px 26px 24px;
  box-shadow: 0 6px 0 rgba(0, 0, 0, 0.06);
}
.eyebrow {
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
h1 {
  font-family: var(--f-display);
  font-size: clamp(2.2rem, 7vw, 3.6rem);
  line-height: 1.05;
  color: var(--tomato);
}
.sub { max-width: 34rem; color: var(--ink); }

/* Catalog */
.catalog { padding-block: 36px 8px; }
.row-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 14px;
}
h2.section {
  font-family: var(--f-display);
  font-size: 1.6rem;
  line-height: 1.1;
}
.hint { color: var(--muted); font-size: 0.92rem; }
.arrows { display: flex; gap: 8px; flex: none; }
.arrow {
  width: 44px; height: 44px;
  display: grid; place-items: center;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 50%;
  cursor: pointer;
  font-size: 1.2rem;
  line-height: 1;
}
.arrow:hover:not(:disabled) { border-color: var(--tomato); color: var(--tomato); }
.arrow:disabled { opacity: 0.35; cursor: default; }

.strip {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  padding: 10px 6px 18px;
  margin-inline: -6px;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}
.pick {
  flex: none;
  width: 13.5rem;
  scroll-snap-align: start;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.pick:hover { transform: translateY(-3px); box-shadow: 0 8px 0 rgba(0, 0, 0, 0.06); }
.pick[aria-pressed="true"] {
  outline: 3px solid var(--tomato);
  outline-offset: 2px;
  border-color: transparent;
}
.disc {
  width: 76px; height: 76px;
  border-radius: 50%;
  background: var(--butter);
  display: grid; place-items: center;
}
.disc svg { width: 52px; height: 52px; display: block; }
.pick .name { font-family: var(--f-display); font-size: 1.3rem; line-height: 1.1; }
.pick .rotname { font-family: var(--f-hand); font-weight: 700; font-size: 1.3rem; line-height: 1; color: var(--tomato); }
.pick .meta { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Detail */
.detail { padding-block: 20px 56px; }
.dhead { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
.dhead h2 {
  font-family: var(--f-display);
  font-size: clamp(1.9rem, 5vw, 2.6rem);
  line-height: 1.05;
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font-size: 0.85rem;
  font-weight: 700;
  padding: 4px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  font-variant-numeric: tabular-nums;
}
.tag {
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 12px;
}

.real {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 24px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.7fr);
  gap: 28px;
}
.real h3, .rot h3 {
  font-family: var(--f-display);
  font-size: 1.2rem;
  margin-bottom: 10px;
}
.ing { list-style: none; padding: 0; display: grid; gap: 8px; }
.ing li {
  display: grid;
  grid-template-columns: 5.8rem minmax(0, 1fr);
  gap: 10px;
  padding-bottom: 8px;
  border-bottom: 1px dashed var(--line);
}
.ing .q { font-weight: 700; font-variant-numeric: tabular-nums; }
.steps { list-style: none; padding: 0; display: grid; gap: 14px; counter-reset: s; }
.steps li {
  counter-increment: s;
  display: grid;
  grid-template-columns: 2rem minmax(0, 1fr);
  gap: 12px;
  align-items: start;
  max-width: 42rem;
}
.steps li::before {
  content: counter(s);
  width: 2rem; height: 2rem;
  border-radius: 50%;
  background: var(--tomato);
  color: var(--tomato-ink);
  font-weight: 700;
  display: grid; place-items: center;
  font-variant-numeric: tabular-nums;
}

.rot-wrap { margin-top: 28px; }
.rot {
  background: var(--note-bg);
  color: var(--note-ink);
  border-radius: 4px;
  padding: 26px 26px 30px;
  box-shadow: 0 10px 22px rgba(0, 0, 0, 0.18);
  transform: rotate(-0.4deg);
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.7fr);
  gap: 24px 28px;
}
.rot .rot-title { grid-column: 1 / -1; }
.rot .rot-title .tagline {
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.75;
}
.rot .rot-title h3 {
  font-family: var(--f-hand);
  font-weight: 700;
  font-size: clamp(2.1rem, 6vw, 3rem);
  line-height: 1;
  margin: 4px 0 0;
}
.rot h3.sm { font-family: var(--f-hand); font-weight: 700; font-size: 1.7rem; margin-bottom: 6px; }
.rot .ing li { border-bottom-color: rgba(42, 36, 16, 0.3); font-family: var(--f-hand); font-weight: 500; font-size: 1.4rem; line-height: 1.15; }
.rot .ing .q { font-weight: 700; }
.rot .steps li { font-family: var(--f-hand); font-weight: 500; font-size: 1.4rem; line-height: 1.2; max-width: 40rem; }
.rot .steps li::before {
  background: transparent;
  border: 2px solid var(--note-ink);
  color: var(--note-ink);
  font-family: var(--f-body);
  font-size: 0.95rem;
}
.rot b { font-weight: 700; }

.foot { border-top: 1px solid var(--line); color: var(--muted); font-size: 0.88rem; }
.foot .wrap { padding-block: 18px; }

@media (max-width: 720px) {
  .real, .rot { grid-template-columns: minmax(0, 1fr); }
  .real { padding: 18px; gap: 22px; }
  .rot { padding: 22px 18px 26px; }
  .top .wrap { padding-block: 28px; }
  .label { padding: 18px; }
  .arrows { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .pick { transition: none; }
  .pick:hover { transform: none; }
}
</style>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="label">
      <span class="eyebrow">Recipe book · 5 pages</span>
      <h1>Brain Rot Cookbook</h1>
      <p class="sub">Pick a page. You get the real recipe first, then the same recipe in brain rot underneath.</p>
    </div>
  </div>
</header>

<main>
  <section class="catalog wrap" aria-labelledby="cat-h">
    <div class="row-head">
      <div>
        <h2 class="section" id="cat-h">The catalog</h2>
        <p class="hint">Scroll sideways, then tap a recipe.</p>
      </div>
      <div class="arrows">
        <button class="arrow" id="prev" type="button" aria-label="Scroll catalog left">&larr;</button>
        <button class="arrow" id="next" type="button" aria-label="Scroll catalog right">&rarr;</button>
      </div>
    </div>
    <div class="strip" id="strip" role="list"></div>
  </section>

  <section class="detail wrap" id="detail" aria-live="polite"></section>
</main>

<footer class="foot">
  <div class="wrap">Times are for a regular home stove. Waffle irons vary, so follow yours.</div>
</footer>

<script>
(function () {

  }
  function stepList(items) {
    return '<ol class="steps">' + items.map(function (s) { return '<li><span>' + s + '</span></li>'; }).join('') + '</ol>';
  }

  strip.innerHTML = R.map(function (r) {
    return '<button class="pick" type="button" role="listitem" data-id="' + r.id + '" aria-pressed="false">' +
      '<span class="disc">' + ICONS[r.id] + '</span>' +
      '<span class="name">' + r.name + '</span>' +
      '<span class="rotname">' + r.rot + '</span>' +
      '<span class="meta">' + r.time + ' · ' + r.level + '</span>' +
      '</button>';
  }).join('');

  function select(id, centerCard) {
    var r = R.filter(function (x) { return x.id === id; })[0] || R[0];
    Array.prototype.forEach.call(strip.children, function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-id') === r.id ? 'true' : 'false');
    });
    detail.innerHTML =
      '<div class="dhead">' +
        '<h2>' + r.name + '</h2>' +
        '<div class="chips"><span class="chip">' + r.time + '</span><span class="chip">' + r.level + '</span><span class="chip">' + r.yields + '</span></div>' +
      '</div>' +
      '<p class="tag">The real recipe</p>' +
      '<div class="real">' +
        '<div><h3>Ingredients</h3>' + ingList(r.ing) + '</div>' +
        '<div><h3>Steps</h3>' + stepList(r.steps) + '</div>' +
      '</div>' +
      '<div class="rot-wrap">' +
        '<p class="tag">Now in brain rot</p>' +
        '<div class="rot">' +
          '<div class="rot-title"><span class="tagline">Same recipe, rotted</span><h3>' + r.rot + '</h3></div>' +
          '<div><h3 class="sm">Ingredients</h3>' + ingList(r.rIng) + '</div>' +
          '<div><h3 class="sm">Steps</h3>' + stepList(r.rSteps) + '</div>' +
        '</div>' +
      '</div>';
    if (centerCard) {
      var card = strip.querySelector('[data-id="' + r.id + '"]');
      if (card) {
        var left = card.offsetLeft - (strip.clientWidth - card.offsetWidth) / 2;
        strip.scrollTo({ left: Math.max(0, left), behavior: behavior });
      }
    }
  }

  strip.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.pick') : null;
    if (b) select(b.getAttribute('data-id'), false);
  });

  function step(dir) {
    var card = strip.querySelector('.pick');
    var w = card ? card.offsetWidth + 14 : 220;
    strip.scrollBy({ left: dir * w * 2, behavior: behavior });
  }
  prev.addEventListener('click', function () { step(-1); });
  next.addEventListener('click', function () { step(1); });

  function arrows() {
    prev.disabled = strip.scrollLeft <= 2;
    next.disabled = strip.scrollLeft + strip.clientWidth >= strip.scrollWidth - 2;
  }
  strip.addEventListener('scroll', arrows, { passive: true });
  window.addEventListener('resize', arrows);

  var start = 'grilled-cheese';
  try {
    var h = (location.hash || '').replace('#', '');
    if (h && R.some(function (x) { return x.id === h; })) start = h;
  } catch (err) {}
  select(start, start !== 'grilled-cheese');
  arrows();
})();
</script>

</body>
</html>
